name: Build Draghetto APK

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Draghetto APK
        run: |
          chmod +x gradlew
          ./gradlew :draghetto:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Draghetto-apk
          path: draghetto/build/outputs/apk/debug/draghetto-debug.apk

      - name: Publish Draghetto APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: draghetto/build/outputs/apk/debug/draghetto-debug.apk
          name: Draghetto Run ${{ github.ref_name }}
